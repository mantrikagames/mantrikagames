<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://cloud.umami.is https://gateway.umami.is; img-src 'self' data:; object-src 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4E342E">
  <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">

  <!-- SEO Metadata via Jekyll SEO Tag -->
  {% seo %}

  <!-- Google Fonts Preload & Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Atom Feed link -->
  {% feed_meta %}

  <!-- Theme loader script -->
  <script src="{{ '/assets/js/theme-loader.js' | relative_url }}"></script>

  <!-- Umami Analytics -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="90efba4d-4fac-40f7-8157-0993a3c06b46"></script>
</head>
