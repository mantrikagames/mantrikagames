      <stop offset="0%" stop-color="#221A16"/>
      <stop offset="100%" stop-color="#110D0B"/>
    </radialGradient>
  </defs>
  <rect width="660" height="660" rx="24" fill="url(#plinthGrad)" stroke="#D4AF37" stroke-width="4"/>
