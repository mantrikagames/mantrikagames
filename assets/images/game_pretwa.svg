<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="10" fill="#4E342E" stroke="#C89B3C" stroke-width="2"/>
  
  <!-- Concentric Rings -->
  <g fill="none" stroke="#C89B3C" stroke-width="2">
    <circle cx="200" cy="200" r="50"/>
    <circle cx="200" cy="200" r="100"/>
    <circle cx="200" cy="200" r="150"/>
    
    <!-- Radial Lines (6 spokes) -->
    <line x1="200" y1="200" x2="350" y2="200"/>
    <line x1="200" y1="200" x2="275" y2="330"/>
    <line x1="200" y1="200" x2="125" y2="330"/>
    <line x1="200" y1="200" x2="50" y2="200"/>
    <line x1="200" y1="200" x2="125" y2="70"/>
    <line x1="200" y1="200" x2="275" y2="70"/>
  </g>
  
  <!-- Intersection Nodes -->
  <g fill="#FAF8F3" stroke="#C89B3C" stroke-width="2">
    <!-- Center Node -->
    <circle cx="200" cy="200" r="5"/>
    
    <!-- Inner Ring Nodes -->
    <circle cx="250" cy="200" r="5"/>
    <circle cx="225" cy="243" r="5"/>
    <circle cx="175" cy="243" r="5"/>
    <circle cx="150" cy="200" r="5"/>
    <circle cx="175" cy="157" r="5"/>
    <circle cx="225" cy="157" r="5"/>
    
    <!-- Middle Ring Nodes -->
    <circle cx="300" cy="200" r="5"/>
    <circle cx="250" cy="287" r="5"/>
    <circle cx="150" cy="287" r="5"/>
    <circle cx="100" cy="200" r="5"/>
    <circle cx="150" cy="113" r="5"/>
    <circle cx="250" cy="113" r="5"/>
    
    <!-- Outer Ring Nodes -->
    <circle cx="350" cy="200" r="5"/>
    <circle cx="275" cy="330" r="5"/>
    <circle cx="125" cy="330" r="5"/>
    <circle cx="50" cy="200" r="5"/>
    <circle cx="125" cy="70" r="5"/>
    <circle cx="275" cy="70" r="5"/>
  </g>
</svg>
