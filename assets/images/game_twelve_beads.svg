<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="10" fill="#4E342E" stroke="#C89B3C" stroke-width="2"/>
  
  <g stroke="#C89B3C" stroke-width="2" fill="none">
    <!-- Horizontal lines -->
    <line x1="50" y1="50" x2="350" y2="50"/>
    <line x1="50" y1="125" x2="350" y2="125"/>
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="50" y1="275" x2="350" y2="275"/>
    <line x1="50" y1="350" x2="350" y2="350"/>
    
    <!-- Vertical lines -->
    <line x1="50" y1="50" x2="50" y2="350"/>
    <line x1="125" y1="50" x2="125" y2="350"/>
    <line x1="200" y1="50" x2="200" y2="350"/>
    <line x1="275" y1="50" x2="275" y2="350"/>
    <line x1="350" y1="50" x2="350" y2="350"/>
    
    <!-- Main diagonals -->
    <line x1="50" y1="50" x2="350" y2="350"/>
    <line x1="350" y1="50" x2="50" y2="350"/>
    
    <!-- Kited diamond diagonals -->
    <line x1="200" y1="50" x2="50" y2="200"/>
    <line x1="50" y1="200" x2="200" y2="350"/>
    <line x1="200" y1="50" x2="350" y2="200"/>
    <line x1="350" y1="200" x2="200" y2="350"/>
  </g>
  
  <!-- 25 Intersection Nodes -->
  <g fill="#FAF8F3" stroke="#C89B3C" stroke-width="2">
    <!-- Row 1 -->
    <circle cx="50" cy="50" r="5"/><circle cx="125" cy="50" r="5"/><circle cx="200" cy="50" r="5"/><circle cx="275" cy="50" r="5"/><circle cx="350" cy="50" r="5"/>
    <!-- Row 2 -->
    <circle cx="50" cy="125" r="5"/><circle cx="125" cy="125" r="5"/><circle cx="200" cy="125" r="5"/><circle cx="275" cy="125" r="5"/><circle cx="350" cy="125" r="5"/>
    <!-- Row 3 -->
    <circle cx="50" cy="200" r="5"/><circle cx="125" cy="200" r="5"/><circle cx="200" cy="200" r="5"/><circle cx="275" cy="200" r="5"/><circle cx="350" cy="200" r="5"/>
    <!-- Row 4 -->
    <circle cx="50" cy="275" r="5"/><circle cx="125" cy="275" r="5"/><circle cx="200" cy="275" r="5"/><circle cx="275" cy="275" r="5"/><circle cx="350" cy="275" r="5"/>
    <!-- Row 5 -->
    <circle cx="50" cy="350" r="5"/><circle cx="125" cy="350" r="5"/><circle cx="200" cy="350" r="5"/><circle cx="275" cy="350" r="5"/><circle cx="350" cy="350" r="5"/>
  </g>
</svg>
