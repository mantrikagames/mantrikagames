<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="10" fill="#4E342E" stroke="#C89B3C" stroke-width="2"/>
  
  <!-- 5x5 Grid Lines -->
  <g stroke="#C89B3C" stroke-width="2" fill="none">
    <!-- Horizontal -->
    <line x1="80" y1="80" x2="320" y2="80"/>
    <line x1="80" y1="140" x2="320" y2="140"/>
    <line x1="80" y1="200" x2="320" y2="200"/>
    <line x1="80" y1="260" x2="320" y2="260"/>
    <line x1="80" y1="320" x2="320" y2="320"/>
    
    <!-- Vertical -->
    <line x1="80" y1="80" x2="80" y2="320"/>
    <line x1="140" y1="80" x2="140" y2="320"/>
    <line x1="200" y1="80" x2="200" y2="320"/>
    <line x1="260" y1="80" x2="260" y2="320"/>
    <line x1="320" y1="80" x2="320" y2="320"/>
    
    <!-- Diagonals -->
    <line x1="80" y1="80" x2="320" y2="320"/>
    <line x1="320" y1="80" x2="80" y2="320"/>
    
    <!-- Inner Diamond Diagonals -->
    <line x1="200" y1="80" x2="320" y2="200"/>
    <line x1="320" y1="200" x2="200" y2="320"/>
    <line x1="200" y1="320" x2="80" y2="200"/>
    <line x1="80" y1="200" x2="200" y2="80"/>
  </g>
  
  <!-- Tigers and Goats Nodes -->
  <g fill="#FAF8F3" stroke="#C89B3C" stroke-width="2">
    <circle cx="80" cy="80" r="5"/>
    <circle cx="200" cy="80" r="5"/>
    <circle cx="320" cy="80" r="5"/>
    <circle cx="140" cy="140" r="5"/>
    <circle cx="260" cy="140" r="5"/>
    <circle cx="80" cy="200" r="5"/>
    <circle cx="200" cy="200" r="5"/>
    <circle cx="320" cy="200" r="5"/>
    <circle cx="140" cy="260" r="5"/>
    <circle cx="260" cy="260" r="5"/>
    <circle cx="80" cy="320" r="5"/>
    <circle cx="200" cy="320" r="5"/>
    <circle cx="320" cy="320" r="5"/>
  </g>
  
  <!-- Active Tiger Token -->
  <circle cx="200" cy="200" r="12" fill="#C89B3C" stroke="#FAF8F3" stroke-width="1.5"/>
</svg>
