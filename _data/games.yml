  country: South India & Sri Lanka
  regional_names: Ali Guli Mane, Vamana Guntalu, Kuzhipara
  description: A traditional Mancala-style game played to capture cowrie shells or tamarind seeds across 14 carved pits. Requires strategic arithmetic and tactical sowing.
