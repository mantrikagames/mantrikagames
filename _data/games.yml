  image: /assets/images/game_pallanguzhi.svg
  image_png: /assets/images/game_pallanguzhi.png
  rules_summary: 14 wooden cups (2 rows of 7). Players take seeds from a pit and sow clockwise, capturing accumulated cups and Pasu stores upon reaching empty pits.
  history: Originating in Tamil Nadu and Karnataka, Pallanguzhi is a traditional mancala-style game mentioned in ancient Sangam literature. Historically played by women and children using cowrie shells or tamarind seeds in a carved wooden board of 14 pits, it was used to teach strategic planning, mental arithmetic, and sharing.

- name: Nine Men's Morris
  country: Global & India (Navakankari)
  regional_names: Navakankari, Merels, Mill
  description: An ancient strategy game where players place and slide pieces along 3 concentric squares to form mills of three, capturing opponent pieces.
  difficulty: Medium
  slug: nine-mens-morris
  status: playable
  category: Strategy
  category_tag: strategy
  players: 2 Players
  player_count_tag: 2
  duration: 15–30 mins
  featured: true
  play_url: /games/nine-mens-morris/
  image: /assets/images/game_morris.svg
  image_png: /assets/images/game_morris.png
  rules_summary: 3 nested squares with 24 intersection points. Form rows of 3 (Mills) to remove an opponent piece. Flying phase when reduced to 3 pieces.
  history: Known as Navakankari in ancient India and Merels in Europe, Nine Men's Morris is one of the oldest strategy games in human history, with boards carved into the temple of Kurna in Egypt (1400 BCE), Ajanta/Ellora caves in India, and widely played across the Roman Empire and Medieval Europe.

