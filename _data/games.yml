- name: Chowka Bara
  country: India (Karnataka, Maharashtra, Tamil Nadu)
  regional_names: Katte Mane, Ashta Chamma, Daayam, Pakidakali, Chauka Bara
  description: A classic race-strategy game played on a 5x5 grid using 4 cowrie shells. Players navigate concentric loops, capture opponent pawns to unlock the inner sanctum, and race to the central Ghar.
  difficulty: Easy
  slug: chowka-bara
  status: playable
  category: Race
  category_tag: race
  players: 2–4 Players
  player_count_tag: 2-4
  duration: 15–30 mins
  featured: false
  play_url: /games/chowka-bara/
  image: /assets/images/game_chowka_bara.svg
  image_png: /assets/images/game_chowka_bara.png
  rules_summary: 5x5 grid with safe Kattas. Roll 4 cowrie shells (values 1, 2, 3, 4, 8). Capture opponent pawns to unlock the inner track and reach the central Ghar.
  history: Also known as Katte Mane in Kannada, Ashta Chamma in Telugu, and Daayam in Tamil, Chowka Bara is one of the most revered traditional board games of the Indian subcontinent, dating back to antiquity and referenced in ancient epic folklore. Historically played on cloth or carved wooden boards with split tamarind seeds or cowrie shells, it teaches probabilistic risk assessment, territorial defense, and tactical encirclement.

- name: Pachisi
  country: Ancient India
  regional_names: Chaupad, Twenty-Five, Sokkattan
  description: The historic race game of India played on a cross-shaped board. Players cast 6 cowrie shells to navigate four pieces home, using safe zones and capturing opponents.
  difficulty: Medium
