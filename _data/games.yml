  board_geometry: 5x5 grid with diagonal intersections (25 nodes, 56 lines)
  rules_summary: "4 tigers start at board corners. Goat player places 20 goats one by one on empty nodes. Tigers jump over adjacent goats along grid lines to capture. Goats win by surrounding all 4 tigers so they cannot move."
  how_to_play:
    - phase: Placement Phase
      text: "The Goat player places one goat per turn on any vacant intersection. During this phase, goats cannot move, but tigers can slide or jump-capture."
    - phase: Movement Phase
      text: "Once all 20 goats are placed, the goat player may slide any goat one step along a grid line to an adjacent vacant intersection."
    - phase: Tiger Captures
      text: "A tiger captures a goat by leaping over it along a straight marked line onto the immediate vacant node beyond."
  rules_detailed:
    - 4 tigers start placed on the four outermost corner nodes.
    - The goat player has 20 goats in reserve.
    - Goats move first.
    - Tigers can jump over a goat in any direction along marked lines, provided the destination node is unoccupied. Multiple jumps in one turn are not allowed.
    - Tigers win if they capture 5 goats.
    - Goats win if they trap and immobilize all 4 tigers so no legal move is possible.
  history: >-
    Revered across the Himalayan valleys of Nepal and northern and southern India, Bagh Bakri has been etched into temple flagstones, courtyard clay, and carved wood for centuries. Known as Bagh Chal (Nepal's national game) and Adu Huli (Karnataka), it embodies the eternal dance of predator and community defense.
  strategy_tips:
    - Goats should maintain tight triangular defensive clusters to prevent tigers from leaping through lines.
