- name: Chowka Bara
  country: India (Karnataka, Maharashtra, Tamil Nadu)
  regional_names: Katte Mane, Ashta Chamma, Daayam, Pakidakali, Chauka Bara
  description: A classic race-strategy game played on a 5x5 grid using 4 cowrie shells. Players navigate concentric loops, capture opponent pawns to unlock the inner sanctum, and race to the central Ghar.
  difficulty: Easy
  slug: chowka-bara
  status: playable
  category: Race
  category_tag: race
  players: 2–4 Players
  player_count_tag: 2-4
  duration: 15–30 mins
  featured: false
  play_url: /games/chowka-bara/
  image: /assets/images/game_chowka_bara.svg
  image_png: /assets/images/game_chowka_bara.png
  rules_summary: 5x5 grid with safe Kattas. Roll 4 cowrie shells (values 1, 2, 3, 4, 8). Capture opponent pawns to unlock the inner track and reach the central Ghar.
  history: Also known as Katte Mane in Kannada, Ashta Chamma in Telugu, and Daayam in Tamil, Chowka Bara is one of the most revered traditional board games of the Indian subcontinent, dating back to antiquity and referenced in ancient epic folklore. Historically played on cloth or carved wooden boards with split tamarind seeds or cowrie shells, it teaches probabilistic risk assessment, territorial defense, and tactical encirclement.

- name: Pachisi
  country: Ancient India
  regional_names: Chaupad, Twenty-Five, Sokkattan
  description: The historic race game of India played on a cross-shaped board. Players cast 6 cowrie shells to navigate four pieces home, using safe zones and capturing opponents.
  difficulty: Medium
  slug: pachisi
  status: playable
  category: Race
  category_tag: race
  players: 2–4 Players
  player_count_tag: 2-4
  duration: 20–45 mins
  featured: false
  play_url: /games/pachisi/
  image: /assets/images/game_pachisi.svg
  image_png: /assets/images/game_pachisi.png
  rules_summary: Cross-shaped board with 4 arms. 6 cowrie shells cast for values (10, 25 [Grace], 2, 3, 4, 5, 6). Navigate pawns around the board perimeter into the central Charkoni.
  history: Regarded as the "National Game of India", Pachisi dates back to at least the 4th century CE. It was so revered that the Mughal Emperor Akbar played it in Fatehpur Sikri using court dancers as live pieces on a giant stone courtyard board. It is the direct ancestor of modern Ludo but with far deeper tactical depth.

- name: Chaupar
  country: Ancient India
  regional_names: Chausar, Chaupad
  description: A strategic royal race game played on a cross-shaped cloth board with 3 long rectangular cubic wooden dice. Featuring no safe zones, players form pairs (Joori) to build impenetrable blockades.
  difficulty: Hard
  slug: chaupar
  status: playable
  category: Strategy
  category_tag: strategy
  players: 2–4 Players
  player_count_tag: 2-4
  duration: 30–60 mins
  featured: false
  play_url: /games/chaupar/
  image: /assets/images/game_chaupar.svg
  image_png: /assets/images/game_chaupar.png
  rules_summary: 3 long cubic dice (Pasa). Pawns move in pairs (Joori) for protection since there are no safe castles on the board.
  history: A royal race game played in the royal courts of India for centuries. Unlike Pachisi, Chaupar features no safe castles on the board and relies heavily on strategic grouping of pieces (Joori) to block opponent paths, requiring absolute tactical precision.

