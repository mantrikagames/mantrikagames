  image: /assets/images/game_bagh_bakri.svg
  image_png: /assets/images/game_bagh_bakri.png
  rules_summary: 5x5 grid with diagonal intersections. Tigers jump over goats along grid lines to capture; goats place and slide to fence in all 4 tigers.
  history: A classic asymmetric hunt game widely played in Nepal and Northern India (often known as Bagh Chal). Tigers hunt goats while goats attempt to fence in the tigers. It represents the eternal struggle between predator and prey, requiring teamwork and sacrifice from the goat player to outwit the tigers.

