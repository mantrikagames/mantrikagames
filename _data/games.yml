  country: Nepal & Northern India
  regional_names: Bagh Chal, Adu Huli, Puli Joodam
  description: An asymmetric strategy game where 4 ferocious tigers hunt 20 goats, while the goats coordinate to surround and immobilize the tigers across a 5x5 intersecting grid.
